name: Kaynak önerisi
description: Bir aracın puanını destekleyen veya çürüten bir kaynak önerin.
title: "[kaynak] "
labels: ["kaynak-önerisi"]
body:
  - type: markdown
    attributes:
      value: |
        Kaynağı siz getirirsiniz, puanı bakımcı verir. Öneriniz doğrudan veriye
        yazılmaz; incelenir ve ilgili aracın kanıt kaydına bağlanır. Gerekçesi
        `docs/ARCHITECTURE.md` içindeki MK-05 kaydında.

  - type: input
    id: car
    attributes:
      label: Hangi araç
      description: Tablodaki adıyla yazın.
      placeholder: "Volvo S60 2.0 D (D3/D4)"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Kaynağın bağlantısı
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: quote
    attributes:
      label: Birebir alıntı ve neyi gösterdiği
      description: >
        Kaynağın hangi cümlesi iddiayı taşıyor? Özet değil, birebir alıntı yazın;
        bağlantı ileride çürürse elimizde kalacak tek şey bu olacak. Altına bir iki
        cümleyle bu alıntının neyi gösterdiğini ekleyin.
    validations:
      required: true

  - type: dropdown
    id: criterion
    attributes:
      label: Hangi kriteri ilgilendiriyor
      description: Emin değilseniz boş bırakabilirsiniz.
      options:
        - Motor Güveni
        - Şanzıman ve Otomatik Kutu
        - Sürüş Keyfi ve Karakter
        - Günlük Kullanım Rahatlığı
        - Yaş, Gövde ve Elektrik Riski
        - Sahip Olma Maliyeti
        - Bulunabilirlik ve Satılabilirlik
        - Teknik künye (şanzıman tipi, beygir, motor kodu)
