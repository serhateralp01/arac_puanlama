name: veri denetimi

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Veri bütünlüğü ve kanıt politikası
        run: python3 scripts/validate.py

      - name: Üretilmiş HTML veriyle uyumlu mu
        run: python3 scripts/build.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tarayıcı duman testi
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/smoke_test.js
