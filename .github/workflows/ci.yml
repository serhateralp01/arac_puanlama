name: veri denetimi

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Veri bütünlüğü ve kanıt politikası
        run: python3 scripts/validate.py

      - name: Üretilmiş HTML veriyle uyumlu mu
        run: python3 scripts/build.py --check

      # Statik sayfalar da türetilmiş çıktı; veriyle uyumsuz kalırlarsa arama
      # motorunda eski bilgi görünür ve bunu kimse fark etmez (Y-11).
      - name: Statik sayfalar veriyle uyumlu mu
        run: python3 scripts/build_pages.py --check

      # İçerik taslakları da türetilmiş çıktı; known_issues güncellenip taslak
      # yeniden üretilmezse eski/yanlış bir taslak sessizce kalır (Y-12).
      - name: İçerik taslakları veriyle uyumlu mu
        run: python3 scripts/build_content.py --check

      # Aynı motoru veya kutuyu paylaşan araçlar arasındaki gerekçesiz puan farkını
      # raporlar. Çıkış kodunu düşürmez; amacı sapmayı gözden kaçırmamak.
      - name: Bileşen bazlı puan tutarlılığı
        run: python3 scripts/consistency.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tarayıcı duman testi
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/smoke_test.js
